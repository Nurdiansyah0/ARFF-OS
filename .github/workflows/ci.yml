name: ARFF-OS Monorepo CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  # JOB 1: GOLANG BACKEND CI
  backend:
    name: Backend (Go) Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go Dependencies
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      - name: Build Go Binary
        run: CGO_ENABLED=0 go build -v ./cmd/api

  # JOB 2: NEXT.JS FRONTEND CI
  frontend:
    name: Frontend (Next.js) Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          BACKEND_API_URL: http://localhost:8080
